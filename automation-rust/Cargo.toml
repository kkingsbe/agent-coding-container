[workspace]
members = [
    "common",
    "state",
    "workspace",
    "executor",
    "scheduler",
    "agents",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "ISC"
authors = ["Automation System"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regular expressions
regex = "1.10"

# Bytes
bytes = "1.5"

# Markdown parsing
pulldown-cmark = "0.12"

# Testing
tempfile = "3.8"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
