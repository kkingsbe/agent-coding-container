#
# 1. Development mode (more frequent runs, verbose logging):
#    [logging]
#    level = "debug"
#
#    [agents.architect]
#    interval_minutes = 10
#
#    [agents.janitor]
#    interval_minutes = 5
#
#    [agents.prompt]
#    interval_minutes = 1
#
# 2. Production mode (less frequent runs, minimal logging):
#    [logging]
#    level = "warn"
#    format = "json"
#    colors = false
#
# 3. Immediate execution on startup (for quick setup):
#    [agents.architect]
#    immediate = true
#
#    [agents.janitor]
#    immediate = true
#
#    [agents.prompt]
#    immediate = true
#
# 4. Custom workspace paths:
#    [workspace]
#    path = "/path/to/my/project"
#    state_path = "/path/to/my/project/.automation-state"
#
# 5. Higher lock timeout for busy systems:
#    [agents.architect.lock]
#    timeout_seconds = 60
#
#    [agents.janitor.lock]
#    timeout_seconds = 60
#
#    [agents.prompt.lock]
#    timeout_seconds = 60
#
# ============================================================================
